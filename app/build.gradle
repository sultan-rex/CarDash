plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sulthan.cardash'
    compileSdk 36
    buildToolsVersion "36.1.0"
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.sulthan.cardash"
        minSdk 22
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':headunit')
}
