plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sulthan.cardash'
    compileSdk 36
    buildToolsVersion "36.1.0"
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.sulthan.cardash"
        minSdk 22
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    // Release signing: the key and its passwords live outside the repo. local.properties (not in git)
    // names a properties file with storeFile, storePassword, keyAlias and keyPassword. Without it the
    // release build falls back to the debug key.
    def local = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) localFile.withInputStream { local.load(it) }
    def signingPath = local.getProperty('cardash.signing')
    def signing = new Properties()
    if (signingPath != null && file(signingPath).exists()) file(signingPath).withInputStream { signing.load(it) }

    signingConfigs {
        if (signing.getProperty('storeFile') != null) {
            release {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signing.getProperty('storeFile') != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':headunit')
}
